name: EAS build (preview)
# Lansează un build EAS cu profilul „preview” (APK Android / IPA iOS ad hoc)
# din GitHub, fără Mac. Necesită secretul EXPO_TOKEN (expo.dev → Account
# settings → Access tokens) în Settings → Secrets and variables → Actions.
# Fișierele Firebase și cheile vin din environment-ul „preview” de pe EAS.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforma
        type: choice
        default: ios
        options: [ios, android, all]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Trigger EAS build
        run: eas build --platform ${{ inputs.platform }} --profile preview --non-interactive --no-wait
