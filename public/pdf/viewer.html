<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' blob:; font-src 'self' blob:; img-src blob: data:; style-src 'unsafe-inline'"><style>
body{margin:0;background:#111923;color:#e7edf7;font:14px system-ui}#tools{position:sticky;top:0;z-index:2;background:#111923;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;flex-wrap:wrap}button{min-width:44px;min-height:44px;border:0;border-radius:22px;background:#263344;color:white;font-size:18px}button:disabled{opacity:.3}#pages{overflow:auto;text-align:center;padding:10px}canvas{background:white;max-width:none}#error{text-align:center;padding:24px}
</style></head><body><div id="tools"><button id="previous">‹</button><span id="position" aria-live="polite"></span><button id="next">›</button><button id="minus">−</button><button id="plus">+</button></div><div id="pages"><canvas id="page"></canvas></div><p id="error" role="alert"></p><script type="module">
import {getDocument,GlobalWorkerOptions} from './pdf.mjs';
GlobalWorkerOptions.workerSrc='./pdf.worker.mjs';
const canvas=document.getElementById('page'),tools=document.getElementById('tools'),error=document.getElementById('error');let pdf,page=1,zoom=1,rendering=null,serial=0,labels={};
const notify=type=>parent.postMessage({type},location.origin);
async function render(){if(!pdf)return;const generation=++serial;try{if(rendering){rendering.cancel();try{await rendering.promise}catch{}}const current=await pdf.getPage(page);if(generation!==serial)return;const base=current.getViewport({scale:1}),width=Math.max(180,innerWidth-24),scale=Math.min(2,devicePixelRatio||1);const viewport=current.getViewport({scale:width/base.width*zoom});canvas.width=viewport.width*scale;canvas.height=viewport.height*scale;canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';rendering=current.render({canvas,canvasContext:canvas.getContext('2d'),viewport,transform:[scale,0,0,scale,0,0]});await rendering.promise;if(generation!==serial)return;document.getElementById('position').textContent=labels.position.replace('{current}',String(page)).replace('{total}',String(pdf.numPages));document.getElementById('previous').disabled=page===1;document.getElementById('next').disabled=page===pdf.numPages;document.getElementById('minus').disabled=zoom<=1;document.getElementById('plus').disabled=zoom>=3;notify('pdf-rendered')}catch(cause){if(cause?.name!=='RenderingCancelledException'){error.textContent=labels.error||'';notify('pdf-error')}}}
addEventListener('message',async event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='pdf-open'||pdf)return;try{const uri=new URL(event.data.uri);if(uri.protocol!=='blob:'||uri.origin!==location.origin)throw Error('invalid');labels=event.data.labels;for(const name of ['previous','next','minus','plus'])document.getElementById(name).setAttribute('aria-label',labels[name]);const bytes=await(await fetch(uri.href,{credentials:'omit'})).arrayBuffer();pdf=await getDocument({data:new Uint8Array(bytes),isEvalSupported:false,enableXfa:false,cMapUrl:'./cmaps/',cMapPacked:true,standardFontDataUrl:'./standard_fonts/',wasmUrl:'./wasm/'}).promise;await render()}catch{error.textContent=labels.error||'';tools.hidden=true;notify('pdf-error')}});
document.getElementById('previous').onclick=()=>{if(pdf&&page>1){page--;render()}};document.getElementById('next').onclick=()=>{if(pdf&&page<pdf.numPages){page++;render()}};document.getElementById('minus').onclick=()=>{zoom=Math.max(1,zoom-.5);render()};document.getElementById('plus').onclick=()=>{zoom=Math.min(3,zoom+.5);render()};addEventListener('resize',()=>render());
</script></body></html>
